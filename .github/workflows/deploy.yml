# CD de Orquesta: despliegue manual (workflow_dispatch) a AWS con Terraform.
#
# Por qué manual y no en cada push:
#   * Las credenciales de AWS Learner Lab duran 4 h; se pegan como secrets antes de desplegar.
#   * El README fija congelamiento de despliegues los sábados (pico de check-in); un botón
#     explícito evita desplegar por accidente durante un evento.
#
# Prerrequisitos (una sola vez, ver README §8 "CI/CD"):
#   * Environment `lab` (y opcionalmente `prod` con revisores obligatorios).
#   * Secrets del environment: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN.
#   * Variable del environment: TF_STATE_BUCKET (bucket S3 existente para el estado de Terraform).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno destino
        type: choice
        options: [lab, prod]
        default: lab
      apply:
        description: Aplicar cambios (si es false, solo plan)
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false # nunca cancelar un apply a medias

permissions:
  contents: read

jobs:
  ci:
    name: CI (gate)
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Terraform ${{ inputs.apply && 'apply' || 'plan' }} → ${{ inputs.environment }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Bloquear despliegues en sábado (America/Mexico_City)
        if: inputs.apply && inputs.environment == 'prod'
        run: |
          if [ "$(TZ=America/Mexico_City date +%u)" = "6" ]; then
            echo "::error::Congelamiento de despliegues: sábado es pico de check-in (README, NFR transversales)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build frontend (Terraform lo sube a S3)
        working-directory: front
        run: |
          npm ci
          npx ng build

      - name: Dependencias de producción del bundle Lambda
        working-directory: back
        run: npm ci --omit=dev

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Backend remoto de estado (S3)
        working-directory: terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Define la variable TF_STATE_BUCKET en el environment ${{ inputs.environment }}."
            exit 1
          fi
          # Archivo generado solo en CI (*_override.tf está en .gitignore): el uso local de
          # Terraform sigue con estado local sin cambios.
          cat > backend_override.tf <<EOF
          terraform {
            backend "s3" {
              bucket = "${TF_STATE_BUCKET}"
              key    = "orquesta/${{ inputs.environment }}/terraform.tfstate"
              region = "${AWS_REGION}"
            }
          }
          EOF

      - name: terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: terraform plan
        working-directory: terraform
        run: terraform plan -input=false -var="environment=${{ inputs.environment }}" -out=tfplan

      - name: terraform apply
        if: inputs.apply
        working-directory: terraform
        run: terraform apply -input=false tfplan

      - name: Smoke test /health
        if: inputs.apply
        working-directory: terraform
        run: |
          API="$(terraform output -raw api_endpoint)"
          for i in $(seq 1 10); do
            if curl -fsS "$API/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::/health no respondió 200 tras el despliegue"
          exit 1
