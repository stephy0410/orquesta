# PostgreSQL local para `npm run test:pg` (misma versión mayor que RDS/Aurora en Terraform).
# Puerto 55432 para no chocar con un Postgres local en 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orquesta_admin
      POSTGRES_PASSWORD: orquesta
      POSTGRES_DB: orquesta
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orquesta_admin -d orquesta"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
